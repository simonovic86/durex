linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  govet:
    disable:
      - buildir

issues:
  exclude-rules:
    # Disable errcheck for test files - examples intentionally ignore errors for brevity
    - path: _test\.go
      linters:
        - errcheck
